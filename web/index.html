<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>docMaker</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/parts.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/layout-c.css">
</head>
<body>
<!-- 採用レイアウト（案C。docs/layout-evaluation.md）。表を最大にし、ロットを選んだときだけ下に「帳票」のトレーが出る。
     ダブルクリックで Edge でそのまま開ける（サーバー不要）。 -->
<div class="app">
  <header class="topbar">
    <span class="topbar__title"><i class="fa-solid fa-file-pen"></i>docMaker</span>
    <div class="searchbox topbar__search"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="search" type="search" placeholder="ロット番号・品名・顧客など、どの項目でも検索" aria-label="検索"></div>
    <ol class="steps" id="steps"></ol>
    <span class="topbar__spacer"></span>
    <span class="note" id="hint"></span>
    <button class="btn btn--primary" id="cta"></button>
    <button class="btn btn--icon btn--ghost" id="help" title="取扱説明書" aria-label="取扱説明書"><i class="fa-solid fa-circle-question"></i></button>
  </header>
  <div class="app__body">
    <nav class="rail" id="rail" aria-label="機能"></nav>
    <aside class="panel hidden" id="panel"></aside>
    <main class="main">
      <div class="chips hidden" id="chips"></div>
      <div class="grid-wrap" id="grid"></div>
      <div class="tray hidden" id="tray" aria-label="選択中のロットと帳票">
        <span class="tray__sel"><i class="fa-solid fa-square-check"></i><b id="n">0</b> 件を選択中 <button class="btn btn--ghost" id="unsel" title="選択をすべて解除"><i class="fa-solid fa-xmark"></i>解除</button></span>
        <span class="tray__label"><i class="fa-solid fa-file-lines"></i>帳票</span>
        <div class="tray__forms" id="cards"></div>
      </div>
      <div class="statusbar" id="status"></div>
    </main>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/forms.js"></script>
<script src="js/query.js"></script>
<script src="js/grid.js"></script>
<script src="js/filter-panel.js"></script>
<script src="js/data-source.js"></script>
<script src="js/panels.js"></script>
<script src="js/preview.js"></script>
<script src="js/rail.js"></script>
<script src="js/help.js"></script>
<script src="js/version.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  DM.grid = new DM.Grid($("grid"), { statusEl: $("status"), formHints: true, onEnter: () => { if (DM.nextAction().key === "preview") DM.openPreview(); } });
  DM.mountSteps($("steps"));
  DM.mountFormChooser($("cards"), { compact: true });
  DM.mountRail({ rail: $("rail"), panel: $("panel"), items: [
    { id: "filter", icon: "fa-filter", label: "条件", title: "絞り込み条件", mount: DM.mountFilterPanel, badge: () => DM.queryState.filters.length },
    { id: "data", icon: "fa-database", label: "データ", sepBefore: true, spacer: true, mount: DM.mountDataPanel },
    { id: "view", icon: "fa-sliders", label: "表示", mount: DM.mountViewPanel }] });
  DM.mountCta($("cta"), $("hint"), {
    load: () => document.querySelector('.rail-btn[data-id="data"]').click(),
    form: () => { const p = $("cards").querySelector(".pill"); if (p) p.focus(); },
    preview: () => DM.openPreview(),
  });
  $("unsel").addEventListener("click", () => { const prev = Array.from(DM.store.selected); DM.store.setSelected([]); DM.toast("選択を解除しました", { icon: "fa-square", undo: () => DM.store.setSelected(prev) }); });
  const tray = () => { const n = DM.store.selected.size; $("tray").classList.toggle("hidden", !n); $("n").textContent = DM.fmtNum(n); };
  DM.bus.on("selection", tray);
  $("help").addEventListener("click", () => DM.openHelp());
  DM.boot({ search: $("search"), chips: $("chips"), empty: true }); tray();
  DM.data.init();                                         // サーバーにつながっていて元ファイルが決まっていれば、自動で読み込む
  DM.version.init(document.querySelector(".topbar"));   // サーバーにつながっているときだけ、版の札などが出る
  DM.maybeAutoHelp();
})();
</script>
</body>
</html>
