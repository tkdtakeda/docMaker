<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>docMaker｜帳票作成ツール</title>
<meta name="theme-color" content="#2f62a3">
<meta name="description" content="品質データのロットを選び、帳票に転記して印刷・Excel 出力する業務ツール">
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="apple-touch-icon" href="img/logo-180.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/parts.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/layout-c.css">
<link rel="stylesheet" href="css/splash.css">
</head>
<body>
<!-- 採用レイアウト（案C。docs/layout-evaluation.md）。表を最大にし、ロットを選んだときだけ下に「帳票」のトレーが出る。
     ダブルクリックで Edge でそのまま開ける（サーバー不要）。 -->
<!-- 起動中の画面。JS が読み込まれる前から出し、準備ができたら js/splash.js が消す -->
<div class="splash" id="splash" role="status" aria-live="polite">
  <button class="btn btn--ghost splash__skip" data-skip title="起動画面を閉じる"><i class="fa-solid fa-forward"></i>スキップ</button>
  <img class="splash__logo" src="img/logo.svg" alt="">
  <h1 class="splash__name">doc<b>Maker</b></h1>
  <p class="splash__tag">ロットを選んで、帳票をすばやく。</p>
  <div class="splash__bar"><i></i></div>
  <p class="splash__msg">起動しています…</p>
  <p class="splash__foot">帳票作成ツール</p>
</div>
<script src="js/splash.js"></script>
<div class="app">
  <header class="topbar">
    <button class="brand" id="brand" title="docMaker について" aria-label="docMaker について"><img src="img/logo.svg" alt=""><span>doc<b>Maker</b></span></button>
    <div class="searchbox topbar__search"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="search" type="search" placeholder="ロット番号・品名・顧客など、どの項目でも検索" aria-label="検索"></div>
    <ol class="steps" id="steps"></ol>
    <span class="topbar__spacer"></span>
    <span class="note" id="hint"></span>
    <button class="btn btn--primary" id="cta"></button>
    <button class="btn btn--icon btn--ghost" id="help" title="取扱説明書" aria-label="取扱説明書"><i class="fa-solid fa-circle-question"></i></button>
  </header>
  <div class="app__body">
    <nav class="rail" id="rail" aria-label="機能"></nav>
    <aside class="panel hidden" id="panel"></aside>
    <main class="main">
      <div class="chips hidden" id="chips"></div>
      <div class="grid-wrap" id="grid"></div>
      <div class="tray hidden" id="tray" aria-label="選択中のロットと帳票">
       <div class="tray__top">
        <span class="tray__sel"><i class="fa-solid fa-square-check"></i><b id="n">0</b> 件を選択中 <button class="btn btn--ghost" id="unsel" title="選択をすべて解除"><i class="fa-solid fa-xmark"></i>解除</button></span>
        <span class="tray__label"><i class="fa-solid fa-file-lines"></i>帳票</span>
        <div class="tray__forms" id="cards"></div>
       </div>
       <div class="selcards" id="selcards" aria-label="選択中のロット"></div>
      </div>
      <div class="statusbar" id="status"></div>
    </main>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/forms.js"></script>
<script src="js/query.js"></script>
<script src="js/grid.js"></script>
<script src="js/filter-panel.js"></script>
<script src="js/data-source.js"></script>
<script src="js/report-bridge.js"></script>
<script src="js/panels.js"></script>
<script src="js/columns-panel.js"></script>
<script src="js/prefs.js"></script>
<script src="js/work-panel.js"></script>
<script src="js/selection-cards.js"></script>
<script src="js/preview.js"></script>
<script src="js/rail.js"></script>
<script src="js/help.js"></script>
<script src="js/version.js"></script>
<script src="js/about.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  DM.grid = new DM.Grid($("grid"), { statusEl: $("status"), formHints: true, onEnter: () => { if (DM.nextAction().key === "preview") DM.openOutput(); } });
  DM.splash.step(0.3, "画面を整えています…");
  DM.mountSteps($("steps"));
  DM.mountFormChooser($("cards"), { compact: true });
  DM.mountRail({ rail: $("rail"), panel: $("panel"), items: [
    { id: "filter", icon: "fa-filter", label: "条件", title: "絞り込み条件", mount: DM.mountFilterPanel, badge: () => DM.queryState.filters.length },
    { id: "work", icon: "fa-bookmark", label: "作業", title: "作業セット・自動保存", mount: DM.mountWorkPanel },
    { id: "report", icon: "fa-file-invoice", label: "帳票", title: "帳票を作る・直す（登録した帳票は全員で使えます）", action: () => DM.reportBridge.online ? DM.reportBridge.openDesign() : DM.toast("帳票の作成は、サーバー（Start.bat）で開いたときに使えます", { icon: "fa-circle-info" }) },
    { id: "data", icon: "fa-database", label: "データ", sepBefore: true, spacer: true, mount: DM.mountDataPanel },
    { id: "view", icon: "fa-sliders", label: "表示", title: "表示（列・密度・列幅）", mount: (el) => { const a = document.createElement("div"), b = document.createElement("div"); a.className = b.className = "pane-part"; el.append(a, b); DM.mountColumnsPanel(a); DM.mountViewPanel(b); } }] });
  DM.mountSelectionCards($("selcards"), { grid: $("grid") });
  DM.mountCta($("cta"), $("hint"), {
    load: () => document.querySelector('.rail-btn[data-id="data"]').click(),
    form: () => { const p = $("cards").querySelector(".pill"); if (p) p.focus(); },
    preview: () => DM.openOutput(),          // サーバーで開いていれば帳票の画面（CDB の帳票部品）、file:// なら仮のプレビュー
  });
  $("unsel").addEventListener("click", () => { const prev = Array.from(DM.store.selected); DM.store.setSelected([]); DM.toast("選択を解除しました", { icon: "fa-square", undo: () => DM.store.setSelected(prev) }); });
  const tray = () => { const n = DM.store.selected.size; $("tray").classList.toggle("hidden", !n); $("n").textContent = DM.fmtNum(n); };
  DM.bus.on("selection", tray);
  $("help").addEventListener("click", () => DM.openHelp());
  $("brand").addEventListener("click", () => DM.openAbout());
  DM.boot({ search: $("search"), chips: $("chips"), empty: true }); tray();
  DM.version.init(document.querySelector(".topbar"));   // サーバーにつながっているときだけ、版の札などが出る
  // 登録済みの帳票（サーバーのときだけ）→ 元ファイルが決まっていれば、自動で読み込む。終わったら起動画面を閉じ、初回案内を出す
  DM.splash.step(0.55, "帳票を読み込んでいます…");
  DM.reports.load().then(() => { DM.splash.wait("データを読み込んでいます…"); return DM.data.init(); })
    .catch(() => {})
    .then(() => DM.splash.done()).then(() => DM.maybeAutoHelp());
})();
</script>
</body>
</html>
