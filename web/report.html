<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳票 | docMaker</title>
<!-- 帳票の画面（CDB の帳票部品）。docMaker の画面の上に、iframe で開く（CSS・JS を docMaker と分けるため）。
     単独で開くこともできる（帳票の作成・直し。データは docMaker の画面から渡されたときだけ入る）。 -->
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="report/css/tokens.css">
<link rel="stylesheet" href="report/css/layout.css">
<link rel="stylesheet" href="report/css/components.css">
<link rel="stylesheet" href="report/css/report.css">
<link rel="stylesheet" href="report/css/sheet.css">
<link rel="stylesheet" href="report/css/block.css">
<style>
  /* iframe の中だけ。CDB の画面の骨組み（app.js）は持ち込まないので、背景と全画面のモーダルだけを置く */
  html, body { height: 100%; margin: 0; background: transparent; }
  .dm-offline { max-width: 560px; margin: 15vh auto; padding: 24px; background: var(--surface, #fff); border-radius: 12px; font-family: "Yu Gothic UI", "Meiryo UI", sans-serif; line-height: 1.7; }
</style>
<script>
  // docMaker の表示密度をそのまま使う（同じ 3 段階）
  try { const d = localStorage.getItem("dm.density"); if (d) document.documentElement.setAttribute("data-density", d); } catch (e) { /* 標準のまま */ }
</script>
</head>
<body>
<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script src="vendor/exceljs/exceljs.min.js"></script>
<script src="report/js/core/util.js"></script>
<script src="report/js/adapter.js"></script>
<script src="report/js/core/undo.js"></script>
<script src="report/js/core/jobs.js"></script>
<script src="report/js/report/formula.js"></script>
<script src="report/js/report/items.js"></script>
<script src="report/js/report/sheet-doc.js"></script>
<script src="report/js/report/sheet-pages.js"></script>
<script src="report/js/report/block-doc.js"></script>
<script src="report/js/report/block-compile.js"></script>
<script src="report/js/report/rowgroup.js"></script>
<script src="report/js/report/model.js"></script>
<script src="report/js/report/xlsx.js"></script>
<script src="report/js/report/sheet-xlsx.js"></script>
<script src="report/js/report/render.js"></script>
<script src="report/js/report/floats.js"></script>
<script src="report/js/ui/common.js"></script>
<script src="report/js/ui/jobs.js"></script>
<script src="report/js/ui/report-items.js"></script>
<script src="report/js/ui/sheet-paper.js"></script>
<script src="report/js/ui/block-image.js"></script>
<script src="report/js/ui/block-state.js"></script>
<script src="report/js/ui/block-canvas.js"></script>
<script src="report/js/ui/block-bar.js"></script>
<script src="report/js/ui/block-side.js"></script>
<script src="report/js/ui/report.js"></script>
<script src="report/js/samples.js"></script>
<script src="report/js/boot.js"></script>
</body>
</html>
