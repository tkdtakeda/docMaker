<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案B 右ドック型 | docMaker</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/parts.css">
<link rel="stylesheet" href="../css/sheet.css">
<link rel="stylesheet" href="../css/layout-b.css">
</head>
<body>
<!-- 案B：表の右に「帳票の選択＋常設プレビュー」を置く。
     仮説：選びながら転記結果を見られれば、画面遷移も確認の手戻りも減る。 -->
<div class="app">
  <header class="topbar">
    <span class="topbar__title"><i class="fa-solid fa-file-pen"></i>docMaker</span>
    <div class="searchbox topbar__search"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="search" type="search" placeholder="どの項目でも検索" aria-label="検索"></div>
    <span class="topbar__spacer"></span>
    <span class="note" id="hint"></span>
    <button class="btn btn--primary" id="cta"></button>
  </header>
  <div class="app__body">
    <nav class="rail" id="rail" aria-label="機能"></nav>
    <aside class="panel hidden" id="panel"></aside>
    <main class="main">
      <div class="chips hidden" id="chips"></div>
      <div class="grid-wrap" id="grid"></div>
      <div class="statusbar" id="status"></div>
    </main>
    <aside class="panel panel--right dock" id="dock">
      <div class="panel__head"><ol class="steps" id="steps"></ol></div>
      <div class="panel__body">
        <div class="group"><div class="group__title"><i class="fa-solid fa-file-lines"></i>帳票の形式</div><div class="dock__forms" id="cards"></div></div>
        <div class="group dock__prev"><div class="group__title"><i class="fa-solid fa-eye"></i>転記の確認（<span id="who">ロット未選択</span>）</div><div class="dock__sheet" id="sheet"></div></div>
      </div>
    </aside>
  </div>
</div>
<script src="../js/core.js"></script>
<script src="../js/sample-data.js"></script>
<script src="../js/forms.js"></script>
<script src="../js/query.js"></script>
<script src="../js/grid.js"></script>
<script src="../js/filter-panel.js"></script>
<script src="../js/panels.js"></script>
<script src="../js/preview.js"></script>
<script src="../js/rail.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  DM.grid = new DM.Grid($("grid"), { statusEl: $("status"), onEnter: () => DM.openPreview() });
  DM.mountSteps($("steps"));
  DM.mountFormChooser($("cards"), {});
  DM.mountRail({ rail: $("rail"), panel: $("panel"), items: [
    { id: "filter", icon: "fa-filter", label: "条件", title: "絞り込み条件", mount: DM.mountFilterPanel, badge: () => DM.queryState.filters.length },
    { id: "data", icon: "fa-database", label: "データ", sepBefore: true, spacer: true, mount: DM.mountDataPanel },
    { id: "view", icon: "fa-sliders", label: "表示", mount: DM.mountViewPanel }] });
  DM.mountCta($("cta"), $("hint"), {
    load: () => document.querySelector('.rail-btn[data-id="data"]').click(),
    form: () => $("cards").querySelector(".form-card").focus(),
    preview: () => DM.openPreview(),
  });
  const drawSheet = () => {                  // 選択ロットの先頭を常時プレビュー
    const form = DM.forms.get(DM.store.formId), rows = DM.store.selectedRows();
    $("who").textContent = rows.length ? `ロット ${rows[0]["ロット番号"]}${rows.length > 1 ? ` ほか ${rows.length - 1} 件` : ""}` : "ロット未選択";
    if (!rows.length) $("sheet").innerHTML = '<div class="state"><i class="fa-regular fa-hand-pointer"></i><strong>表でロットを選ぶと、ここに転記結果が出ます</strong></div>';
    else if (!form) $("sheet").innerHTML = '<div class="state"><i class="fa-regular fa-file-lines"></i><strong>上で帳票の形式を選んでください</strong></div>';
    else $("sheet").innerHTML = DM.forms.renderSheet(form, rows[0]);
  };
  ["selection", "form"].forEach((n) => DM.bus.on(n, drawSheet));
  DM.boot({ search: $("search"), chips: $("chips") }); drawSheet();
})();
</script>
</body>
</html>
